exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start hyprland-session.target
exec-once = hyprpaper

input {
    kb_layout = us
    follow_mouse = 2
    sensitivity = -0.65
}

cursor {
    no_warps = true
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
}

decoration {
    rounding = 8
    inactive_opacity = 0.9
    active_opacity = 1.0
}

monitor = DP-1, 2560x1440@165, 0x0, 1
monitor = DP-2, 2560x1440@144, auto-left, 1

$terminal = ghostty
$menu = wofi --show drun
$browser = firefox
$file_explorer = thunar

bind = SUPER, Return, exec, $terminal
bind = SUPER, Space, exec, $menu
bind = SUPER, B, exec, $browser
bind = SUPER, F, exec, $file_explorer
bind = SUPER, D, exec, discord
bind = SUPER, S, exec, steam
bind = SUPER, Q, killactive
bind = SUPER, M, exit

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u

bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4

bind = SUPER, Home, exec, grim -g "$(slurp)" ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png
bind = SUPER SHIFT, Home, exec, grim -g "$(slurp)" - | wl-copy
